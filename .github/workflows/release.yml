name: Auto Release on Version Bump

# Runs only when style.css changes on a push to main - i.e. whenever you
# bump the Version: header. Reads that version, and if a matching tag
# doesn't exist yet, creates the tag + GitHub Release automatically
# (which is what generates the zip PUC picks up on client sites).

on:
  push:
    branches:
      - main
    paths:
      - 'style.css'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from style.css
        id: get_version
        run: |
          VERSION=$(grep -m 1 "^Version:" style.css | sed -E 's/Version:\s*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}